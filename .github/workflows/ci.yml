name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[test]"

      - name: Lint
        run: |
          pip install ruff
          ruff check src tests

      - name: Test
        run: python -m pytest tests/ -v

  ha-test:
    # Home Assistant integration tests; the HA test plugin pins a Home
    # Assistant release that needs Python >= 3.14.2.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: pip install -e ".[ha-test]"

      - name: Lint
        run: |
          pip install ruff
          ruff check custom_components tests_ha

      - name: Test
        run: python -m pytest tests_ha/ -v
