[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pypopur"
version = "0.1.0"
description = "Async local-first client and firmware-4 codecs for Popur S7 devices"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "pypopur contributors"}]
dependencies = ["cryptography>=43", "tinytuya>=1.15"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pypopur = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
# Ported modules mirror the app's catch-Throwable semantics (listener dispatch,
# frame parsing) — broad catches are the contract.
"src/pypopur/**" = ["BLE001", "S110", "S112"]
